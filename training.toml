schema_version = 2
id = "python-for-data-science"
title = "Python for data science"
content_language = "en"
summary = """
The Python programming language is increasingly popular. It is a versatile language for general purpose programming and accessible for novice programmers. However, it is also increasingly used for data science applications. This training introduces modules that are useful in that context.
"""
languages = ["Python"]

[[learning_outcomes]]
statement = "Be able to use pandas to represent, compute with and query data."
competencies = ["pandas.read-tabular-data", "pandas.transform-and-query-data"]

[[learning_outcomes]]
statement = "Be able to visualize data with seaborn and holoviews."
competencies = ["data-science.create-statistical-and-interactive-visualizations"]

[[learning_outcomes]]
statement = "Be able to create data visualizations with matplotlib and bokeh."
competencies = ["matplotlib.create-basic-plots", "data-science.create-statistical-and-interactive-visualizations"]

[[learning_outcomes]]
statement = "Be able to parse textual information using regular expressions."
competencies = ["data-science.extract-data-with-regular-expressions"]

[[learning_outcomes]]
statement = "Be able to interact with relational databases using SQLAlchemy."
competencies = ["data-science.query-relational-databases"]

[[learning_outcomes]]
statement = "Be able to extract information from web pages using beautiful soup."
competencies = ["data-science.extract-web-page-data"]

[[learning_outcomes]]
statement = "Be able to represent and query geographical information using geopandas."
competencies = ["data-science.represent-and-query-geospatial-data"]

[source]
metadata_document = "docs/README.md"
repository_url = "https://github.com/gjbex/Python-for-data-science/"
website_url = "https://gjbex.github.io/Python-for-data-science/"
license = "CC-BY-4.0"

[delivery]
duration_minutes = 240
duration_kind = "fixed"
session_count = 1
target_session_duration_minutes = 240
schedule_complete = true
description = """
Total duration: 4 hours.
"""

[audience]
description = """
This training is for you if you need to use Python for data analysis.
"""

[prerequisites]
summary = """
You will need experience programming in Python. This is not a training that starts from scratch. Familiarity with numpy is not required, but would be beneficial. If you plan to do Python programming in a Linux or HPC environment you should be familiar with these as well. More concretely, participants should already be comfortable with the following: * running Python code in Jupyter or from the command line; * variables, numbers, strings, booleans, and basic containers such as lists, tuples, sets, and dictionaries; * `if`/`else` statements and `for` loops; * writing and calling simple functions with arguments and a return value; * indexing and slicing sequences; * importing modules and calling functions from them; * reading and making small changes to short Python scripts; * basic string handling and simple file-oriented workflows such as reading or writing CSV-like data. You do not need prior experience with pandas, polars, seaborn, HoloViews, regular expressions, SQLAlchemy, Beautiful Soup, GeoPandas, DuckDB, or xarray. Those are part of the training itself.
"""
competencies = ["python.run-code", "python.values-and-containers", "python.control-flow-and-comprehensions", "python.functions", "python.index-and-slice-sequences", "python.import-modules", "python.file-io"]

[self_assessment]
introduction = """
If you can do most of the tasks below without looking up basic Python syntax, you are likely ready for this training.
"""
tasks = [
  "Write a function that returns all negative numbers from a list.",
  "Loop over rows in a small CSV file and count how often a value occurs.",
  "Use `if`/`else` to classify a measurement as low, normal, or high.",
  "Extract a slice from a list or string and explain what it contains.",
  "Import a module such as `csv`, `math`, or `pathlib` and call one of its functions.",
  "Build a dictionary that maps names to values and retrieve one by key.",
  "Read a short script that uses a function, a loop, and a few imports without needing every line explained.",
  "Make a small change to an example notebook or script and run it again."
]

[requirements]
software = [
  "Laptop or desktop with internet access.",
  "A system set up so you can connect to an HPC system, an account on an HPC system (e.g., VSC, CECI, ...), compute credits if that is required to run jobs on the HPC system if you want to use an HPC system.",
  "A Python environment that can run Jupyter Lab if you want to use your own system.",
  "Access to Google Colaboratory if you prefer not to install software."
]

[level]
introductory_percent = 30
intermediate_percent = 50
advanced_percent = 20
description = """
For participants who already have basic Python programming experience, the material in this training is approximately These percentages describe the level of the data science topics covered in the training, not the required entry level in Python itself.
"""

[[materials]]
kind = "slides"
path = "python_for_data_science.pptx"

[[materials]]
kind = "source-code"
path = "source-code"

[[materials]]
kind = "exercises"
path = "hands-on"

[[materials]]
kind = "environment"
path = "environment.yml"

